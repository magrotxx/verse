name: Build Verse Intel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -m
          sw_vers
          swift --version
          cmake --version

      - name: Build Intel Verse app
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          chmod +x build.sh
          ./build.sh
          file build/Verse.app/Contents/MacOS/Verse

      - name: Package Verse.app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Verse.app Verse-Intel.app.zip

      - name: Upload Intel app
        uses: actions/upload-artifact@v4
        with:
          name: Verse-Intel-App
          path: Verse-Intel.app.zip
